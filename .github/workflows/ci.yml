name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: Node.jsを準備
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: コード形式を確認
        run: npm run format:check

      - name: 型を確認
        run: npm run typecheck

      - name: コード品質を確認
        run: npm run lint

      - name: テストを実行
        run: npm run test

      - name: 本番ビルドを確認
        run: npm run build
